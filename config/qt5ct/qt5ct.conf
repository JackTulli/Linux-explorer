[Appearance]
style=Windows
color_scheme_path=~/.config/qt5ct/colors/Windows2000.conf
custom_palette=true
icon_theme=Chicago95
standard_dialogs=default

[Fonts]
general="Tahoma,8,-1,5,50,0,0,0,0,0"
fixed="Monospace,9,-1,5,50,0,0,0,0,0"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=2
cursor_flash_time=1060
double_click_interval=500
gui_effects=@Invalid()
keyboard_scheme=3
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
