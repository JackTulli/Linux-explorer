# Installed by Linux-explorer's install.sh on virtual machines.
#
# The hypervisor's display often never shows the X server's hardware
# cursor plane, so the pointer is invisible while everything else works.
# A software cursor is composed into the framebuffer and always shows.
# Remove this file to go back to the hardware cursor.
Section "OutputClass"
    Identifier "w2k software cursor (virtio-gpu)"
    MatchDriver "virtio_gpu"
    Option "SWcursor" "on"
EndSection
Section "OutputClass"
    Identifier "w2k software cursor (QXL)"
    MatchDriver "qxl"
    Option "SWcursor" "on"
EndSection
Section "OutputClass"
    Identifier "w2k software cursor (VMware)"
    MatchDriver "vmwgfx"
    Option "SWcursor" "on"
EndSection
Section "OutputClass"
    Identifier "w2k software cursor (VirtualBox)"
    MatchDriver "vboxvideo"
    Option "SWcursor" "on"
EndSection
Section "OutputClass"
    Identifier "w2k software cursor (bochs)"
    MatchDriver "bochs-drm"
    Option "SWcursor" "on"
EndSection
Section "OutputClass"
    Identifier "w2k software cursor (simple framebuffer)"
    MatchDriver "simpledrm"
    Option "SWcursor" "on"
EndSection
